<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RapidAPI</title>
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="ejercicio2.css" />
</head>
<body class="bg-light">

  <header class="bg-dark text-white py-4 shadow-sm mb-4">
    <div class="container text-center">
      <h1 class="h3 fw-bold">Ejercicios por parte del cuerpo</h1>
    </div>
  </header>

  <main class="container-fluid px-lg-5 mb-5">
    <div id="statusContainer" class="text-center my-4 d-none">
      <div id="spinner" class="spinner-border text-primary" role="status">
        <span class="visually-hidden">cargando datos...</span>
      </div>
      <div id="errorMessage" class="alert alert-danger mt-3 d-none mx-auto" style="max-width: 600px;" role="alert"></div>
    </div>

    <div class="row">
      <section class="col-lg-7 col-xl-8 mb-4">
        <div class="d-flex justify-content-between align-items-center border-bottom pb-2 mb-3">
          <span id="badgeCount" class="badge bg-secondary">0 ejercicios</span>
        </div>
        <div id="exercisesContainer" class="row g-3">
        </div>
      </section>

      <section class="col-lg-5 col-xl-4">
        <div class="sticky-top" style="top: 20px;">
          <h2 class="h5 border-bottom pb-2 mb-3">Ficha técnica del ejercicio</h2>
          <div id="detailContainer" class="card shadow-sm p-4">
            <p class="text-muted text-center my-5">
              Haz clic sobre cualquier ejercicio de la lista para cargar su técnica, músculos secundarios e instrucciones.
            </p>
          </div>
        </div>
      </section>
    </div>
  </main>

  <script src="ejercicio2.js"></script>
</body>
</html>
